name: Validate and publish knowledge feed
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [catalog.json, release.json, scripts/build-feed.py]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build-feed.py
      - name: Commit validated release artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json releases/
          if ! git diff --cached --quiet; then
            git commit -m "Publish validated knowledge release [skip ci]"
            git push
          fi
